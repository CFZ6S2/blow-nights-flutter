name: blow_nights
description: "Blow Nights - Tu guía de la noche"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  # Google Sign-In
  google_sign_in: ^7.2.0

  # Maps (OpenStreetMap - no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^14.0.3

  # State management
  provider: ^6.1.4

  # Navigation
  go_router: ^18.0.1

  # HTTP
  http: ^1.3.0

  # Utils
  intl: ^0.20.2
  cached_network_image: ^4.0.2
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3

  # BLE
  flutter_blue_plus: ^2.3.13

  # QR
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  cloud_functions: ^6.5.0
  firebase_app_check: ^0.4.8
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^16.7.0
  share_plus: ^13.3.0
  image_picker: ^1.2.3
  crypto: ^3.0.7
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  vector_map_tiles: ^8.0.0
  nfc_manager: ^4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
    - assets/i18n_app/
    - assets/data/
