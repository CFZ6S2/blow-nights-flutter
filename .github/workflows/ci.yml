name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Same version as the local SDK (C:\dev\flutter); bump both together.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - run: flutter pub get

      # analysis_options.yaml decides what fails; any issue (info included) fails the job.
      - run: flutter analyze

      # No Firebase or dart_defines.json needed: tests only cover pure Dart (e.g. BLE id rotation vectors).
      - run: flutter test

  build-apk:
    name: Build APK
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # AGP 9 needs JDK 17+.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      # The project's gradle.properties asks for -Xmx8G (Flutter template) and the Kotlin daemon inherits it: more than
      # a private-repo runner has, so the first run got Gradle killed (exit 143). ~/.gradle/gradle.properties takes
      # precedence over the project's, so this only changes CI.
      - name: Fit Gradle memory to the runner
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          kotlin.daemon.jvmargs=-Xmx1536m
          EOF

      # Compile check of everything analyze can't see: Kotlin (friend finder service, HCE, key renewal), Gradle, R8.
      # One ABI is enough for that and halves time and memory. Built without dart_defines.json, so this APK has no
      # App Check debug token and can't call Firebase; it is not uploaded. Builds to install still come from a machine
      # with dart_defines.json.
      - run: flutter build apk --release --target-platform android-arm64
