name: iOS TestFlight

# Builds the iPhone app, signs it and uploads it to App Store Connect (TestFlight). Run it by hand from the Actions
# tab ("Run workflow"). Nobody here has a Mac: GitHub's macOS runners do the whole job (free, the repo is public).
#
# Repository secrets it needs (Settings → Secrets and variables → Actions), all from the Apple developer account:
#   APPLE_TEAM_ID        Team ID (developer.apple.com → Account → Membership details), 10 characters
#   ASC_KEY_ID           App Store Connect API key id (App Store Connect → Users and Access → Integrations → Keys)
#   ASC_ISSUER_ID        Issuer ID shown on that same page
#   ASC_KEY_P8_BASE64    The downloaded AuthKey_XXXX.p8, in base64. The key needs the "Admin" role so Xcode can
#                        create the certificates and provisioning profiles by itself (cloud signing): no .p12 or
#                        profile is ever stored here.
#   PLACES_API_KEY       Same value as in dart_defines.json (address autocomplete)
#
# The version and build number come from pubspec.yaml; App Store Connect refuses a build number it has already seen.

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: Build, sign and upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      PLACES_API_KEY: ${{ secrets.PLACES_API_KEY }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=0
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 PLACES_API_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: App Store Connect API key
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Flutter build settings
        run: |
          version_name=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+)\+.*/\1/')
          version_code=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          echo "Version $version_name ($version_code)"
          # No APPCHECK_DEBUG_TOKEN: the release iPhone build uses App Attest.
          flutter build ios --release --config-only \
            --dart-define=PLACES_API_KEY="$PLACES_API_KEY" \
            --dart-define=GIT_SHA="$(git rev-parse --short HEAD)" \
            --dart-define=BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --dart-define=APP_VERSION_NAME="$version_name" \
            --dart-define=APP_VERSION_CODE="$version_code"

      - name: Archive (signed)
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic

      - name: Export and upload to App Store Connect
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
